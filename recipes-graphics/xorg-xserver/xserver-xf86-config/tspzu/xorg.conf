Section "Device"
  Identifier "ZynqMP"
  Driver "modesetting"
  # Option "AccelMethod" "none"
  # Disable HW cursor since it makes the cursor blink at movement
  # Option "SWcursor" "on"
EndSection

Section "Screen"
        Identifier      "DefaultScreen"
        Device          "ZynqMP"
        # Setting DefaultDepth to 16 is the key to make the displayport
        # work.
        DefaultDepth    16
EndSection

