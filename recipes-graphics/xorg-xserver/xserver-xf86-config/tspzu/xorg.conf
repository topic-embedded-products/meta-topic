Section "Module"
    # Disable glx which makes e.g. scaling extremely slow because
    # of lack of hardware acceleration
    # On the ZynqMP DisplayPort, this crashes the Xserver.
    Disable "glx"
EndSection

Section "Device"
  Identifier "ZynqMP"
  Driver "modesetting"
  # Option "AccelMethod" "none"
  # Disable HW cursor, on the ZynqMP DisplayPort, this crashes the Xserver.
  Option "SWcursor" "on"
EndSection

Section "Screen"
        Identifier      "DefaultScreen"
        Device          "ZynqMP"
        # Setting DefaultDepth to 16 is the key to make the displayport
        # work.
        DefaultDepth    16
EndSection

